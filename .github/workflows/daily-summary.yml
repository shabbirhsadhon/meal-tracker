name: Daily Telegram Summary

on:
  # Fallback only: GitHub's scheduler can run hours late. The exact-time trigger
  # comes from an external timer calling the workflow_dispatch API at 00:01 BST.
  # 18:01 UTC = 00:01 BST (UTC+6)
  schedule:
    - cron: '10 18 * * *'

  # Manual / external trigger
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today's summary was already sent"
        type: boolean
        default: false

# Never run two at once, so a late cron run can't race the external trigger
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  send-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily summary script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: python send_daily_summary.py
